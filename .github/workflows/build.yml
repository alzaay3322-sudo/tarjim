name: Build Windows Installer
on: [workflow_dispatch, push]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pyinstaller PySide6 faster-whisper argostranslate edge-tts numpy PyAudioWPatch
      - run: pyinstaller --noconfirm --windowed --name Tarjim --collect-all faster_whisper --collect-all ctranslate2 --collect-all argostranslate --collect-all edge_tts app.py
      - run: choco install innosetup -y
      - run: iscc installer.iss
      - uses: actions/upload-artifact@v4
        with:
          name: Tarjim-Setup
          path: Output/Tarjim-Setup.exe
